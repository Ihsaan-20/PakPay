# ==========================================
# 1. GLOBAL SETTINGS
# ==========================================
#spring.profiles.active=dev

# Feature Toggle
app.features.email-alerts-enabled=false

# Professional Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{0} - %msg%n
logging.level.root=INFO
logging.level.com.example.pakpay=DEBUG

# Security & JWT
# Note: React integration ke waqt secret key 32 chars se lambi honi chahiye
jwt.secret=${JWT_SECRET:DevKey32CharsLongForSecurityTesting!!}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ==========================================
# 2. DATABASE & JPA SETTINGS (Dev Profile)
# ==========================================
# spring.datasource.url=jdbc:mysql://localhost:3306/pakpay_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
server.port=${PORT:8080}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================
# 3. MAIL SETTINGS
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password-here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true