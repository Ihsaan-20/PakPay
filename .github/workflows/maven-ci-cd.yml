# Pakpay: Spring Boot 3.5.x + Java 17 (see pakpay/pom.xml)
# Builds with Maven Wrapper; MySQL 8 matches application.properties (JPA).

name: Maven CI / CD

on:
  push:
    branches: [main, master, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: pakpay_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/pakpay_db?useSSL=false&serverTimezone=Asia/Karachi&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci
      WHATSAPP_BASE_URL: http://dummy:2785/api
      WHATSAPP_API_KEY: dummy-key
      WHATSAPP_SESSION_ID: dummy-session
      PAKPAY_WHATSAPP_ENABLED: false

    defaults:
      run:
        working-directory: pakpay

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: pakpay/pom.xml

      - name: Maven verify (compile, test, package)
        run: chmod +x mvnw && ./mvnw -B -ntp verify

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: pakpay-jar
          path: pakpay/target/*.jar
          if-no-files-found: error

  release:
    name: GitHub Release (tags only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: pakpay-jar
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
